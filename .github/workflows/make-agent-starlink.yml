name: Build and Push Starlink Agent (Alpine arm64)

on:
  push:
    paths:
      - 'Dockerfiles/agent2/alpine/**'
      - '.github/workflows/make-agent-starlink.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./Dockerfiles/agent2/alpine
          file: ./Dockerfiles/agent2/alpine/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/starlink-agent:alpine-arm64
        uses: docker/build-push-action@v5
        with:
          context: ./Dockerfiles/agent2/alpine
          file: ./Dockerfiles/agent2/alpine/Dockerfile
          push: true
          tags: taofineberg/zabbix-docker-agent2-alpine:latest
